<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}DeadlineWise{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><nav><a class="brand" href="{{ url_for('dashboard') }}">DeadlineWise</a><a class="button" href="{{ url_for('add_task') }}">+ Add task</a></nav>
<main>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}</body></html>
