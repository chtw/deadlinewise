{% extends "base.html" %}{% block title %}{{ 'Edit' if task else 'Add' }} task{% endblock %}{% block content %}
<section class="form-card"><h1>{{ 'Edit task' if task else 'Add academic task' }}</h1><p>Saved directly to AWS DynamoDB.</p>
<form method="POST" class="task-form">
<label>Task title<input name="title" required value="{{ task.title if task else '' }}" placeholder="Database report"></label>
<label>Module<input name="module" required value="{{ task.module if task else '' }}" placeholder="EG2E14"></label>
<label>Task type<select name="task_type">{% for x in ['Assignment','Test','Project','Presentation','Practical','Report','CCA'] %}<option {{ 'selected' if task and task.task_type==x }}>{{ x }}</option>{% endfor %}</select></label>
<label>Deadline<input type="datetime-local" name="deadline" required value="{{ task.deadline if task else '' }}"></label>
<label>Estimated hours<input type="number" name="estimated_hours" min="1" max="200" step="0.5" required value="{{ task.estimated_hours if task else 5 }}"></label>
<label>Module grade weight (%)<input type="number" name="grade_weight" min="0" max="100" required value="{{ task.grade_weight if task else 20 }}"></label>
<label>Difficulty<select name="difficulty">{% for x in ['Easy','Medium','Hard'] %}<option {{ 'selected' if (task and task.difficulty==x) or (not task and x=='Medium') }}>{{ x }}</option>{% endfor %}</select></label>
<label>Progress (%)<input type="number" name="progress" min="0" max="100" required value="{{ task.progress if task else 0 }}"></label>
<label>Remind me<select name="reminder_hours">{% for value,label in [(24,'24 hours before'),(72,'3 days before'),(168,'7 days before')] %}<option value="{{ value }}" {{ 'selected' if task and task.reminder_hours|int==value }}>{{ label }}</option>{% endfor %}</select></label>
<button class="button submit" type="submit">{{ 'Save changes' if task else 'Save task to AWS' }}</button></form></section>{% endblock %}
