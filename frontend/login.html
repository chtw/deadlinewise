<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · DeadlineWise</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="features.css"></head><body class="auth-body"><main class="auth-shell"><section class="auth-intro"><p class="eyebrow">DEADLINEWISE</p><h1>Your deadlines, made clear.</h1><p>Plan assignments, understand priorities and receive private reminders.</p></section><section class="auth-card"><div class="auth-tabs"><button id="signInTab" class="active">Sign in</button><button id="signUpTab">Create account</button></div><div id="authMessage" class="flash error" hidden></div><form id="signInForm"><label>Email<input id="loginEmail" type="email" required></label><label>Password<input id="loginPassword" type="password" minlength="8" required></label><button class="button submit">Sign in</button></form><form id="signUpForm" hidden><label>Name<input id="signupName" required></label><label>Email<input id="signupEmail" type="email" required></label><label>Password<input id="signupPassword" type="password" minlength="8" required></label><button class="button submit">Create account</button></form><form id="confirmForm" hidden><h2>Verify your email</h2><p>Enter the code Cognito emailed you.</p><label>Verification code<input id="confirmCode" required></label><button class="button submit">Verify account</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script><script src="config.js"></script><script src="auth.js"></script><script src="login.js"></script></body></html>
