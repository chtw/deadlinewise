<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeadlineWise</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav><a class="brand" href="#">DeadlineWise</a><button id="showForm" class="button">+ Add task</button></nav>
  <main>
    <div id="message" class="flash" hidden></div>
    <section class="hero"><p class="eyebrow">AWS-POWERED STUDENT PLANNER</p><h1>Know what to work on next.</h1><p>Explainable priorities based on urgency, progress, difficulty and grade weight.</p></section>
    <section id="taskFormPanel" class="form-card" hidden>
      <div class="panel-head"><h2 id="formTitle">Add academic task</h2><button id="closeForm" class="icon-button">×</button></div>
      <form id="taskForm" class="task-form">
        <input type="hidden" id="taskId">
        <label>Task title<input id="title" required placeholder="Database report"></label>
        <label>Module<input id="module" required placeholder="EG2E14"></label>
        <label>Task type<select id="taskType"><option>Assignment</option><option>Test</option><option>Project</option><option>Presentation</option><option>Practical</option><option>Report</option><option>CCA</option></select></label>
        <label>Deadline<input type="datetime-local" id="deadline" required></label>
        <label>Estimated hours<input type="number" id="estimatedHours" min="1" max="200" step="0.5" value="5" required></label>
        <label>Module grade weight (%)<input type="number" id="gradeWeight" min="0" max="100" value="20" required></label>
        <label>Difficulty<select id="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></label>
        <label>Progress (%)<input type="number" id="progress" min="0" max="100" value="0" required></label>
        <label>Remind me<select id="reminderHours"><option value="24">24 hours before</option><option value="72">3 days before</option><option value="168">7 days before</option></select></label>
        <button class="button submit" type="submit" id="saveButton">Save task to AWS</button>
      </form>
    </section>
    <section id="summary" class="summary"></section>
    <section id="focus" class="focus" hidden></section>
    <div id="workloadAlert" class="workload-alert" hidden></div>
    <section class="filter-bar">
      <label>Module<select id="moduleFilter"><option value="all">All modules</option></select></label>
      <label>Type<select id="typeFilter"><option value="all">All types</option><option>Assignment</option><option>Test</option><option>Project</option><option>Presentation</option><option>Practical</option><option>Report</option><option>CCA</option></select></label>
      <label>Status<select id="statusFilter"><option value="all">All statuses</option><option>Pending</option><option>Completed</option></select></label>
      <label>Sort<select id="sortTasks"><option value="priority">Recommended</option><option value="deadline">Nearest deadline</option><option value="progress">Lowest progress</option><option value="weight">Highest grade weight</option></select></label>
      <button id="clearFilters" class="clear-filter">Clear</button>
    </section>
    <p id="loading" class="empty">Loading tasks from AWS…</p>
    <section id="taskGrid" class="task-grid"></section>
  </main>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
