<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar · DeadlineWise</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="features.css"></head>
<body><nav><a class="brand" href="index.html">DeadlineWise</a><div class="nav-actions"><a class="nav-link" href="index.html">Dashboard</a><a class="nav-link active" href="calendar.html">Calendar</a><a class="nav-link" href="settings.html">Settings</a><button class="nav-link logout" onclick="DeadlineWiseAuth.logout()">Log out</button><a class="button nav-button" href="index.html">+ Add task</a></div></nav>
<main><section class="calendar-hero"><div><p class="eyebrow">DEADLINE CALENDAR</p><h1>See the month at a glance.</h1><p>Review every assignment, test and presentation by its due date.</p></div><div class="calendar-controls"><button id="previousMonth">←</button><button id="todayButton">Today</button><button id="nextMonth">→</button></div></section><div id="calendarMessage" class="flash error" hidden></div>
<section class="calendar-layout"><div class="calendar-card"><div class="calendar-title-row"><h2 id="monthTitle"></h2><span id="monthTaskCount" class="month-count"></span></div><div class="weekday-row"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="calendarGrid" class="calendar-grid"></div></div><aside class="upcoming-panel"><p class="eyebrow">UPCOMING</p><h2>Next deadlines</h2><div id="upcomingList"><p>Loading tasks…</p></div></aside></section></main>
<script src="config.js"></script><script src="auth.js"></script><script src="calendar.js"></script></body></html>
